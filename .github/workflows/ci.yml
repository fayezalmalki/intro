name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · tests · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        # PGlite runs Postgres in-process, so migrations, constraints and the
        # RLS rehearsal all run here with no database service to provision.
        run: npm test
      - name: Verify migrations are in sync with the schema
        # Catches a schema edit that never had `npm run db:generate` run for it.
        run: |
          npx drizzle-kit generate --name ci-drift-check
          if [ -n "$(git status --porcelain drizzle/)" ]; then
            echo "::error::Schema and migrations have drifted. Run 'npm run db:generate' and commit the result."
            git status --porcelain drizzle/
            exit 1
          fi
      - name: Build
        run: npm run build

  e2e:
    name: browser flow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run the flow end to end
        # Against a real Postgres: scripts/db-local.mjs serves PGlite over the
        # Postgres wire protocol, so this exercises the same driver path as
        # Neon rather than a stand-in. Nothing to provision.
        #
        # Deliberately `npm run dev`, not `npm start`: the flow uses the
        # account shortcut, which is disabled outside development. The
        # production build is verified by the `check` job instead.
        env:
          DATABASE_DRIVER: postgres-js
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          # The flow signs in as a requester and as an account manager, so
          # NextAuth needs a signing key. Not a secret: it signs throwaway
          # sessions inside a disposable runner, and nothing it signs outlives
          # the job.
          AUTH_SECRET: ci-only-not-a-secret-0000000000000000
        run: |
          sh scripts/pg-start.sh "$RUNNER_TEMP/pg.log"
          npm run db:reset
          npm run dev &
          npx wait-on http://localhost:3000 --timeout 120000
          node scripts/e2e.mjs "$RUNNER_TEMP/shots"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
