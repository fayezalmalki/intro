name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · tests · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        # Generates Worker binding + runtime types into .cloudflare/types first.
        run: npm run typecheck
      - name: Unit tests
        # Run inside workerd through Miniflare: real local D1 with the real
        # migrations, and the real AccountGate Durable Object.
        run: npm test
      - name: Verify migrations are in sync with the schema
        # Catches a schema edit that never had `npm run db:generate` run for it.
        run: |
          npx drizzle-kit generate --name ci-drift-check
          if [ -n "$(git status --porcelain drizzle/)" ]; then
            echo "::error::Schema and migrations have drifted. Run 'npm run db:generate' and commit the result."
            git status --porcelain drizzle/
            exit 1
          fi
      - name: Build
        run: npm run build

  e2e:
    name: browser flow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium-headless-shell
      - name: Run the flow end to end
        # Against the local Workers runtime: local D1, the AccountGate Durable
        # Object, and the simulated send_email binding (sign-in codes are read
        # back from .cloudflare/tmp/email). No Cloudflare account needed.
        #
        # Deliberately `npm run dev`: the flow uses the account shortcut, which
        # is disabled outside development. The production build is verified by
        # the `check` job instead.
        run: |
          printf 'BETTER_AUTH_SECRET=ci-only-not-a-secret-0000000000000000\nBETTER_AUTH_URL=http://localhost:3000\nADMIN_EMAILS=admin@intro.sa\n' > .dev.vars
          npm run dev &
          # Any HTTP answer means the server is up (health is 503 until migrated).
          timeout 120 sh -c 'until curl -s -o /dev/null http://localhost:3000/api/health; do sleep 1; done'
          npm run db:local -- --seed
          node scripts/e2e.mjs "$RUNNER_TEMP/shots"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
