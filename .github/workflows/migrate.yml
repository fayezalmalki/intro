name: Migrate

# Applies database migrations after a merge to main.
#
# Not on pull requests, and not from `next build`: a preview deploy sharing the
# connection string would otherwise run DDL against production.
#
# Needs a repository secret. Vercel's environment variables are a separate
# store — a workflow on GitHub's runners cannot read them.
#
#   Settings → Secrets and variables → Actions → New repository secret
#   DATABASE_URL_UNPOOLED   (from Vercel's Neon integration)
#
# The unpooled connection is deliberate: the pooled one goes through pgbouncer,
# which can mangle DDL and prepared statements.
#
# Until that secret exists this workflow is inert — it says what is missing and
# succeeds rather than failing every merge.

on:
  push:
    branches: [main]
    paths:
      - "drizzle/**"
      - ".github/workflows/migrate.yml"
  workflow_dispatch:

concurrency:
  group: migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply migrations
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          if [ -z "$DATABASE_URL_UNPOOLED" ]; then
            echo "::notice::DATABASE_URL_UNPOOLED is not set — skipping. Add it under Settings → Secrets and variables → Actions."
            exit 0
          fi
          npm run db:migrate
