name: Migrate

# Applies D1 migrations and seeds the people graph after a merge to main.
#
# Not on pull requests, and not from the build: migrations are an explicit
# deploy step against the production database.
#
# This job FAILS when a secret is missing. An earlier version skipped and
# succeeded — and the result was a green check that read as "migrations ran"
# while the database stayed empty, which is how production once broke.
#
#   Settings → Secrets and variables → Actions → New repository secret
#   CLOUDFLARE_API_TOKEN   (D1 edit permission on the account)
#   CLOUDFLARE_ACCOUNT_ID
#   D1_DATABASE_ID         (the intro-db UUID, after the first deploy creates it)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Check the secrets are configured
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID D1_DATABASE_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set. Migrations cannot run, so the database will not match the code that is about to deploy."
              exit 1
            fi
          done

      - name: Apply migrations
        run: npm run db:migrate:remote

      # The people graph only. Accounts come from real sign-ins — see
      # lib/db/seed.ts.
      - name: Seed the people graph
        run: npm run db:seed:remote
